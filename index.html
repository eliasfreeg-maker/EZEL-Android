<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZEL | معرض الأعمال</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#fff4d6;
  text-align:center;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 10%,rgba(255,190,90,.22),transparent 23%),
    radial-gradient(circle at 85% 25%,rgba(255,150,30,.18),transparent 28%),
    linear-gradient(180deg,#2b1205 0%,#5a280b 35%,#3b1705 70%,#1f0d03 100%);
  background-attachment:fixed;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  padding:12px 14px;
  background:rgba(35,14,3,.92);
  border-bottom:1px solid #b87827;
  backdrop-filter:blur(8px);
}

.nav{
  max-width:1000px;
  margin:auto;
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

.nav a{
  text-decoration:none;
  color:#ffe0a0;
  padding:9px 15px;
  border-radius:22px;
  font-size:14px;
}

.nav a.active{
  background:linear-gradient(180deg,#c47a19,#8b4b0d);
  color:white;
}

.hero{
  padding:45px 18px 28px;
}

.logo{
  font-size:56px;
  font-weight:bold;
  letter-spacing:5px;
  color:#f6c766;
  text-shadow:
    0 2px 0 #7b420b,
    0 0 18px rgba(255,191,80,.28);
}

.sub{
  margin-top:10px;
  color:#f2d39b;
  font-size:19px;
}

.slogan{
  margin-top:28px;
  font-size:27px;
  color:#fff0c9;
  text-shadow:0 2px 10px #000;
}

.whatsapp{
  display:inline-block;
  margin-top:22px;
  padding:15px 28px;
  background:linear-gradient(180deg,#22db68,#0cad42);
  color:white;
  text-decoration:none;
  border-radius:14px;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 0 20px rgba(20,230,100,.25);
}

.services{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  padding:30px 16px;
  max-width:900px;
  margin:auto;
}

.service{
  padding:15px 8px;
  color:#f5d59a;
}

.icon{
  width:58px;
  height:58px;
  margin:0 auto 10px;
  border:1px solid #d69231;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  background:rgba(74,32,7,.5);
  box-shadow:0 0 14px rgba(255,175,50,.13);
}

.gallery-wrap{
  padding:12px 14px 35px;
}

.gallery-title{
  font-size:34px;
  margin:10px 0 25px;
  color:#f7c96d;
  text-shadow:0 2px 12px #000;
}

.gallery-title:after{
  content:"";
  display:inline-block;
  width:55px
